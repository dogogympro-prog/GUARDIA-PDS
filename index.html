<style>
/* Una sola vista nocturna: pantalla oscura de patrullero, alto contraste, botones grandes, barra inferior al alcance del pulgar. */
:root{
  color-scheme:dark;
  --noche:#0f1720; --panel:#18232f; --borde:#2d3d4d; --texto:#edf2f6; --suave:#a6b5c3;
  --senal:#f5b83d; --senal-txt:#1b1405; --ok:#54c98c; --alerta:#ff8a73;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--noche);color:var(--texto);font:400 17px/1.45 var(--body);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
header{padding-top:max(12px, env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--borde)}
header h1{font-size:25px;letter-spacing:.02em}
#reloj{font:700 25px var(--display);color:var(--senal);font-variant-numeric:tabular-nums}
main{flex:1;overflow-y:auto;padding:16px 16px 28px}
.vista{display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
nav{padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--borde);background:var(--panel)}
nav button{background:none;border:0;border-top:3px solid transparent;padding:11px 2px 13px;font-weight:600;font-size:13px;color:var(--suave);min-height:54px;padding-left:0;padding-right:0;cursor:pointer}
nav button[aria-current="page"]{color:var(--senal);border-top-color:var(--senal)}
.panel{background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:11px}
.panel h2{font-size:23px}
.ayuda{color:var(--suave);font-size:15px;margin:0}
.aviso{border-left:4px solid var(--senal);padding:9px 12px;background:#2a2517;font-size:15px;border-radius:0 6px 6px 0}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--suave);min-width:0}
input:not([type=checkbox]),select,textarea{width:100%;background:var(--noche);border:1px solid var(--borde);border-radius:6px;padding:11px;font-size:17px;font-weight:400;color:var(--texto)}
textarea{min-height:92px;resize:vertical}
:focus-visible{outline:3px solid var(--senal);outline-offset:1px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fila{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--panel);border:1px solid var(--suave);border-radius:6px;padding:11px 14px;font-weight:600;min-height:46px;cursor:pointer}
.btn.prim{background:var(--senal);color:var(--senal-txt);border-color:var(--senal);font-weight:700}
.btn.peligro{border-color:var(--alerta);color:var(--alerta)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.chico{min-height:38px;padding:6px 10px;font-size:15px}
.chip{background:none;border:1px solid var(--borde);border-radius:6px;padding:8px 10px;font-weight:600;font-size:15px;cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--senal);color:var(--senal-txt);border-color:var(--senal)}
.nov{display:grid;grid-template-columns:58px 1fr;gap:4px 10px;padding:11px 0;border-top:1px solid var(--borde)}
.nov:first-child{border-top:0}
.nov time{font:700 21px var(--display);color:var(--senal);font-variant-numeric:tabular-nums}
.nov b{font-weight:700}
.nov p{margin:2px 0 0;overflow-wrap:anywhere}
.etiqueta{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--suave);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--suave)}
.acciones{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}
.salida{white-space:pre-wrap;background:var(--noche);border:1px solid var(--borde);border-radius:6px;padding:12px;font-size:16px;overflow-wrap:anywhere}
.faltante{color:var(--senal)}
.check{display:flex;flex-direction:row;gap:10px;align-items:flex-start;color:var(--texto);font-weight:400;font-size:16px;padding:9px 0;border-top:1px solid var(--borde);cursor:pointer}
.check input{width:24px;height:24px;margin:0;flex:none;accent-color:var(--senal)}
.check small{display:block;color:var(--suave);font-size:14px;margin-top:1px}
.check.hecho span{color:var(--suave);text-decoration:line-through}
.check.hecho small{text-decoration:none}
details{background:var(--panel);border:1px solid var(--borde);border-radius:8px}
summary{padding:13px 14px;font:700 21px var(--display);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
details>div{padding:0 14px 12px}
.prog{font:600 15px var(--body);color:var(--senal);font-variant-numeric:tabular-nums;white-space:nowrap}
.grande{font:700 39px/1 var(--display);color:var(--senal);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--borde);border-radius:6px;padding:8px}
.tile strong{display:block;font:700 27px var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--suave)}
.mesnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mesnav h3{font-size:23px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:13px;color:var(--suave);font-weight:600}
.dia{aspect-ratio:1;min-height:42px;background:none;border:1px solid var(--borde);border-radius:6px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-variant-numeric:tabular-nums}
.dia.guardia{background:var(--senal);color:var(--senal-txt);border-color:var(--senal)}
.dia.hoy{outline:2px solid var(--texto);outline-offset:1px}
.dia.sel{box-shadow:0 0 0 3px var(--ok)}
.dia small{font-size:11px;font-weight:700;line-height:1}
.dia:not(.guardia) small{color:var(--ok)}
.tel{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--borde);align-items:center}
.tel a{font:700 25px var(--display);color:var(--senal)}
.norma{border-top:1px solid var(--borde);padding-top:10px}
.norma h3{font-size:20px}
.norma p{margin:4px 0}
.norma a{color:var(--senal)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.flota{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 0;border-top:1px solid var(--borde);align-items:center}
.flota:first-child{border-top:0}
.flota b{font:700 23px var(--display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;align-self:flex-start;width:max-content;font-size:13px;font-weight:700;border-radius:4px;padding:1px 6px;background:#3a2020;color:var(--alerta)}
.pill.ok{background:#17352a;color:var(--ok)}
.item{border-top:1px solid var(--borde);padding:9px 0;display:flex;flex-direction:column;gap:6px}
.item:first-child{border-top:0}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tres .chip{padding:6px 4px}
.modal{position:fixed;inset:0;background:rgba(5,9,13,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal.ver{display:flex}
.modal .panel{width:100%;max-width:560px}
#tostada{position:fixed;left:16px;right:16px;bottom:76px;margin:auto;max-width:360px;background:var(--ok);color:#06180f;font-weight:700;text-align:center;border-radius:6px;padding:10px;display:none;z-index:6}
@media (max-width:370px){nav button{font-size:12px}.dos{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.vista{animation:ent .12s ease-out}@keyframes ent{from{transform:translateY(3px)}to{transform:none}}}

#bloqueo{position:fixed;inset:0;z-index:100;background:#0f1720;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#bloqueo .panel{width:100%;max-width:440px;box-shadow:0 18px 60px #0009}
#bloqueo h2{font-size:28px}
#bloqueo .ayuda{line-height:1.5}
#bloqueoEstado{min-height:22px;color:var(--alerta);font-size:14px}

</style>
</head>
<body>
<header><h1>Guardia PBA</h1><div class="fila" style="align-items:center"><div id="reloj" aria-label="Hora actual">--:--</div><button class="btn chico" id="bloqManual" type="button">Bloquear</button></div></header>
<main id="main"></main>
<nav aria-label="Secciones" id="nav"></nav>
<div class="modal" id="conf" role="alertdialog" aria-modal="true" aria-labelledby="confT"><div class="panel"><h2 id="confT">¿Estás seguro?</h2><p class="ayuda" id="confMsg"></p><div class="fila"><button class="btn" id="confNo">No, volver</button><button class="btn peligro" id="confSi">Sí, borrar</button></div></div></div>
<div class="modal" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"><div class="panel"><h2 id="dlgT"></h2><p class="ayuda" id="dlgA"></p>
  <label>Contraseña<input id="dlg1" type="password" autocomplete="new-password"></label><label id="dlgL2">Repetí la contraseña<input id="dlg2" type="password" autocomplete="new-password"></label>
  <div id="dlgE" role="status" style="color:var(--alerta);font-size:14px;min-height:20px"></div><div class="fila"><button class="btn" id="dlgNo" type="button">Cancelar</button><button class="btn prim" id="dlgSi" type="button">Aceptar</button></div></div></div>
<div id="tostada" role="status"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalT"><div class="panel">
  <h2 id="modalT">Copiá el texto</h2>
  <p class="ayuda" id="modalA">Tu navegador no dejó copiar automáticamente. Mantené apretado el texto y elegí Copiar.</p>
  <textarea id="modalTxt" rows="9"></textarea>
  <div class="fila" id="modalBtns"><button class="btn prim" id="modalOk">Cerrar</button></div>
</div></div>

<div id="bloqueo" role="dialog" aria-modal="true" aria-labelledby="bloqueoTitulo"><section class="panel">
  <h2 id="bloqueoTitulo">Guardia PBA protegida</h2>
  <p class="ayuda" id="bloqueoTexto">Preparando almacenamiento seguro…</p>
  <label id="pinLabel">Contraseña<input id="pin1" type="password" inputmode="text" autocomplete="current-password" maxlength="64" placeholder="Ingresá tu contraseña"></label>
  <label id="pinRepetirLabel" style="display:none">Repetí la contraseña<input id="pin2" type="password" inputmode="text" autocomplete="new-password" maxlength="64" placeholder="Repetí la contraseña"></label>
  <p class="ayuda" id="pinAyuda">Usá una contraseña que no uses en otros servicios. No existe recuperación si lo olvidás.</p>
  <div id="bloqueoEstado" role="status"></div>
  <button class="btn prim" id="pinAccion" type="button" disabled>Un momento…</button>
  <button class="btn" id="huellaBtn" type="button" style="display:none">Desbloquear con huella</button>
</section></div>
<script>
"use strict";
const CLAVE="guardia-pba-v1";
const hoyISO=()=>iso(new Date());
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const horaAhora=()=>new Date().toTimeString().slice(0,5);
function fechaGuardia(){const n=new Date();try{if(D&&D.turnos&&horaAhora()<D.turnos.hora)return iso(new Date(n.getFullYear(),n.getMonth(),n.getDate()-1))}catch(e){}return iso(n)}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const fechaAR=f=>{if(!f)return"";const[a,m,d]=f.split("-");return d+"/"+m+"/"+a};
const nuevoId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- Datos ---------- */
const inicial=()=>({
  nov:[
    {id:"e1",hora:"06:40",cat:"Recorrida",lugar:"Av. Ejemplo y Calle 1",txt:"Recorrida preventiva sin novedad.",ej:true},
    {id:"e2",hora:"07:15",cat:"Llamado 911",lugar:"Calle 2 N° 100",txt:"Vecino informa ruido. Se constata música alta, se dialoga y cesa.",ej:true}
  ],
  hist:[],
  turnos:{ref:"2026-11-04",hora:"08:00",valor:0,ads:{},conf:true,h8:true},
  flota:[{id:"m1",puesto:"Cuadrícula 1",num:"29.190",desde:"2026-11-06"},{id:"m2",puesto:"Cuadrícula 2",num:"29.052",desde:"2026-11-06"},{id:"m3",puesto:"Base",num:"",desde:""},{id:"m4",puesto:"Base",num:"",desde:""},{id:"m5",puesto:"Operativos",num:"",desde:""}],
  recep:[],borrador:null,llamados:[],personas:[],dominios:[],personal:[],servicio:{fecha:hoyISO(),filas:{}},servicios:[],cambios:[],ultBk:"",domic:[],perim:[],rondines:[],pasadas:[],entregas:[],vendedores:[],criterioPerim:"Si se constata el incumplimiento, se traslada a la parte que está más lejos de su domicilio. En lugar neutral, se traslada a quien llegó segundo. Siempre manda lo que indique la fiscalía.",cierres:CIERRES_INI(),cierresV1:true,yo:{jer:"Subtte.",nombre:"Bogado Matías Ezequiel",legajo:"186.063"},val202611b:true,adEf:[],adObj:OBJ_INI(),adV2:true,cuadriculas:["Cuadrícula 1","Cuadrícula 2","Zona céntrica","Refuerzo de cuadrícula"],adVal:VALORES_INI(),adic:[],
  fonetico:"A=Alicia\nB=Beatriz\nC=Carolina\nD=Dorotea\nE=Eva\nF=Francisca\nG=Guillermina\nH=Hombre\nI=Inés\nJ=Julia\nK=Kilo\nL=Lucía\nM=María\nN=Natalia\nÑ=Ñandú\nO=Ofelia\nP=Petrona\nQ=Quintana\nR=Rosa\nS=Sara\nT=Teresa\nU=Úrsula\nV=Venezuela\nW=Washington\nX=Xilofón\nY=Yolanda\nZ=Zapato\n1=primero\n2=segundo\n3=tercero\n4=cuarto\n5=quinto\n6=sexto\n7=séptimo\n8=octavo\n9=noveno\n0=nada",
  codigos:"QAP=A la escucha\nQSL=Comprendido\nQTH=Dirección o ubicación\nQRT=Finalizar comunicación\nQRA=Nombre\nQRV=Adelante\nQRK=Reporte de señales\nQRL=Ocupado\nQRM=Interferencia\nQRU=Tráfico o mensaje para recibir o enviar\nH1=Limpieza del móvil\n115=Bajar a dependencia",
  items:["Carrocería","Luces","Sirena y balizas","Radio","Cubiertas y auxilio","Documentación","Agua","Aceite"],
  frases:["Recorrida sin novedad.","Zona sin novedad.","Control vehicular sin novedad.","Traslado sin novedad.","Se constata la situación y se dialoga con las partes.","Se retira del lugar sin más novedad."]
});
let hayStorage=true, D=inicial(), claveLocal=null, saltLocal=null, desbloqueada=false, guardadoPendiente=Promise.resolve(), datosLegado=null;
try{const raw=localStorage.getItem(CLAVE);if(raw){const parsed=JSON.parse(raw);if(parsed&&parsed.formato==="guardia-pba-local-cifrado-v1"){datosLegado=parsed;}else{datosLegado=parsed;}}}
catch(e){hayStorage=false;datosLegado=null;}
function normalizarDatos(p){D=Object.assign(inicial(),p||{});D.turnos=Object.assign(inicial().turnos,p&&p.turnos||{});if(!D.turnos.conf){D.turnos.ref="2026-11-04";D.turnos.conf=true}if(!(p&&p.turnos&&p.turnos.h8)&&D.turnos.hora==="07:00")D.turnos.hora="08:00";D.turnos.h8=true;if(!(p&&p.val202611b)){VALORES_INI().forEach(v=>{if(!D.adVal.some(x=>x.grupo===v.grupo&&x.desde===v.desde))D.adVal.push(v)})}D.val202611b=true;if(!(p&&p.cierresV1)){CIERRES_INI().forEach(c=>{if(!D.cierres.some(x=>x.id===c.id))D.cierres.push(c)})}D.cierresV1=true;if(!(p&&p.adV2)&&Array.isArray(p&&p.adObj)&&!D.adObj.some(o=>o.id==="ca"))D.adObj.push(CANCHA());D.adV2=true;}
function guardar(){
  if(!desbloqueada||!claveLocal)return;
  const snapshot=JSON.stringify(D);
  guardadoPendiente=guardadoPendiente.then(async()=>{const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},claveLocal,new TextEncoder().encode(snapshot));const envelope={formato:"guardia-pba-local-cifrado-v1",version:1,salt:b64(saltLocal),iv:b64(iv),datos:b64(ct)};localStorage.setItem(CLAVE,JSON.stringify(envelope));datosLegado=envelope;hayStorage=true;}).catch(()=>{hayStorage=false;tostada("No se pudo guardar cifrado. No cierres la app y exportá un respaldo.")});
}


/* ---------- Utilidades ---------- */
function tostada(t){const e=$("tostada");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",1800)}
function verModal(txt,titulo,ayuda){$("modalT").textContent=titulo;$("modalA").textContent=ayuda;$("modalTxt").value=txt;$("modal").classList.add("ver");$("modalTxt").focus()}
$("modalOk").onclick=()=>$("modal").classList.remove("ver");
async function copiar(txt,ok){
  try{await navigator.clipboard.writeText(txt);tostada(ok||"Copiado")}
  catch(e){verModal(txt,"Copiá el texto","Tu navegador no dejó copiar automáticamente. Mantené apretado el texto y elegí Copiar.")}
}

async function claveRespaldo(pass,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
const b64=a=>{const u=new Uint8Array(a);let out="";for(let i=0;i<u.length;i+=32768)out+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(out)};
const deB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function cifrarRespaldo(paquete,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await claveRespaldo(pass,salt);
  const datos=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(paquete)));
  return {formato:"guardia-pba-backup-cifrado",version:1,kdf:"PBKDF2-SHA-256",iteraciones:250000,cifrado:"AES-256-GCM",salt:b64(salt),iv:b64(iv),datos:b64(datos)};
}
async function descifrarRespaldo(p,pass){
  const key=await claveRespaldo(pass,deB64(p.salt));
  const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:deB64(p.iv)},key,deB64(p.datos));
  return JSON.parse(new TextDecoder().decode(raw));
}

// Cifrado local: PBKDF2 deriva una clave AES-256-GCM del PIN. La clave solo vive en memoria.
async function claveLocalDesdePin(pin,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
}
async function cifrarLocal(obj,key){const iv=crypto.getRandomValues(new Uint8Array(12));const datos=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj)));return {formato:"guardia-pba-local-cifrado-v1",version:1,iv:b64(iv),datos:b64(datos)};}
async function descifrarLocal(env,key){const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:deB64(env.iv)},key,deB64(env.datos));return JSON.parse(new TextDecoder().decode(raw));}
function pantallaBloqueo(modo,mensaje){
  const overlay=$("bloqueo");overlay.style.display="flex";$("main").innerHTML="";$("nav").innerHTML="";$("pin1").value="";$("pin2").value="";
  $("bloqueoTitulo").textContent=modo==="crear"?"Crear protección de Guardia PBA":"Guardia PBA protegida";
  $("bloqueoTexto").textContent=mensaje;
  $("pinRepetirLabel").style.display=modo==="crear"?"flex":"none";
  $("pinLabel").firstChild.textContent=modo==="crear"?"Crear contraseña":"Contraseña";
  $("pin1").autocomplete=modo==="crear"?"new-password":"current-password";
  $("pinAyuda").textContent=modo==="crear"?"Mínimo 10 caracteres, con letras y números. Si la olvidás, no se pueden recuperar los datos cifrados.":"El contenido se descifra solo en este dispositivo mientras la app está desbloqueada.";
  $("pinAccion").textContent=modo==="crear"?"Crear protección":"Desbloquear";$("pinAccion").disabled=false;$("bloqueoEstado").textContent="";
  $("pinAccion").dataset.modo=modo;setTimeout(()=>$("pin1").focus(),50);
}
async function migrarFotos(){

/* ---------- Turnos 24x48 ---------- */
const CICLO=3;
const nDia=f=>{const[a,m,d]=f.split("-").map(Number);return Math.round(Date.UTC(a,m-1,d)/864e5)};
const esGuardia=(f,ref)=>{const r=(nDia(f)-nDia(ref))%CICLO;return r===0||r===-0||(r+CICLO)%CICLO===0};
function proximaGuardia(ahora,ref,hora){
  const[h,mi]=hora.split(":").map(Number);
  for(let i=-1;i<=CICLO+1;i++){
    const d=new Date(ahora.getFullYear(),ahora.getMonth(),ahora.getDate()+i,h,mi);
    if(!esGuardia(iso(d),ref))continue;
    const fin=new Date(d.getTime()+864e5);
    if(ahora>=d&&ahora<fin)return{enCurso:true,ini:d,fin};
    if(d>ahora)return{enCurso:false,ini:d,fin};
  }
  return null;
}
function resumenMes(a,m,T){
  const dias=new Date(a,m+1,0).getDate();let g=0,ad=0;
  for(let d=1;d<=dias;d++){const f=iso(new Date(a,m,d));if(esGuardia(f,T.ref))g++;ad+=+(T.ads[f]||0)}
  return{guardias:g,horas:g*24,adicional:ad,importe:ad*(+T.valor||0)};
}
const hoy0=new Date();let calA=hoy0.getFullYear(),calM=hoy0.getMonth(),diaSel=null;
function restante(ms){const h=Math.floor(ms/36e5),d=Math.floor(h/24);return d?d+" d "+(h%24)+" h":h+" h "+Math.floor(ms%36e5/6e4)+" min"}
const fmtDia=d=>d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
function urlCalendario(ini,T){
  const f=d=>iso(d).replace(/-/g,"")+"T"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"00";
  const fin=new Date(ini.getTime()+864e5);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Guardia 24x48")+"&dates="+f(ini)+"/"+f(fin)+"&ctz=America/Argentina/Buenos_Aires&recur="+encodeURIComponent("RRULE:FREQ=DAILY;INTERVAL="+CICLO);
}
function vistaTurnos(){
  const T=D.turnos,p=proximaGuardia(new Date(),T.ref,T.hora),R=resumenMes(calA,calM,T);
  const primero=(new Date(calA,calM,1).getDay()+6)%7,dias=new Date(calA,calM+1,0).getDate();
  let celdas="";for(let i=0;i<primero;i++)celdas+="<span></span>";
  for(let d=1;d<=dias;d++){const f=iso(new Date(calA,calM,d)),ad=T.ads[f];
    celdas+=`<button class="dia ${esGuardia(f,T.ref)?"guardia":""} ${f===hoyISO()?"hoy":""} ${f===diaSel?"sel":""}" data-dia="${f}" aria-label="${fechaAR(f)}${esGuardia(f,T.ref)?", guardia":""}${ad?", "+ad+" horas adicionales":""}">${d}${ad?`<small>+${ad}h</small>`:""}</button>`}
  const mes=(m=>m.charAt(0).toUpperCase()+m.slice(1))(new Date(calA,calM,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"}));
  return `<div class="vista">
  ${T.conf?"":`<div class="aviso">Cargá abajo la fecha de una guardia tuya real. El calendario muestra una guardia hoy solo como ejemplo.</div>`}
  <section class="panel">
    <h2>${p&&p.enCurso?"Estás de guardia":"Próxima guardia"}</h2>
    ${p?`<div class="grande">${p.enCurso?"Faltan "+restante(p.fin-new Date()):"En "+restante(p.ini-new Date())}</div>
    <p class="ayuda" style="text-transform:none">${p.enCurso?"Termina el "+fmtDia(p.fin)+" a las "+T.hora:"Entrás el "+fmtDia(p.ini)+" a las "+T.hora}</p>`:""}
  </section>
  <section class="panel">
    <div class="mesnav"><button class="btn chico" id="mesAnt" aria-label="Mes anterior">Anterior</button><h3>${mes}</h3><button class="btn chico" id="mesSig" aria-label="Mes siguiente">Siguiente</button></div>
    <div class="tiles"><div class="tile"><strong>${R.guardias}</strong><span>guardias</span></div><div class="tile"><strong>${R.horas}</strong><span>horas de guardia</span></div><div class="tile"><strong>${R.adicional}</strong><span>horas adicionales</span></div></div>

    <p class="ayuda">Tocá un día para cargar horas adicionales. Las guardias cuentan en el mes en que empiezan.</p>

  </div>`;

function atarTurnos(){
  document.querySelectorAll("[data-dia]").forEach(b=>b.onclick=()=>{diaSel=b.dataset.dia;pintar()});
  $("mesAnt").onclick=()=>{calM--;if(calM<0){calM=11;calA--}diaSel=null;pintar()};
  $("mesSig").onclick=()=>{calM++;if(calM>11){calM=0;calA++}diaSel=null;pintar()};
  const ok=$("adOk");if(ok)ok.onclick=()=>{const v=+$("adH").value;if(v>0)D.turnos.ads[diaSel]=v;else delete D.turnos.ads[diaSel];guardar();diaSel=null;pintar();tostada("Horas guardadas")};

const cent=n=>Math.round(n*100)/100,pesos=n=>"$"+(+n).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const objDe=a=>D.adObj.find(x=>x.id===a.obj);
function importeTurno(a){const m=minutosTurno(a),o=objDe(a);return m==null||!o?0:m/60*valorDe(o.grupo,a.fecha)}
function turnosMes(mes){const ix=a=>D.adObj.findIndex(o=>o.id===a.obj);return D.adic.filter(a=>a.pid&&a.fecha.startsWith(mes)).sort((a,b)=>a.fecha.localeCompare(b.fecha)||ix(a)-ix(b)||String(a.entrada).localeCompare(String(b.entrada)))}
function datosRendicion(mes){
  const l=turnosMes(mes);
  return GRUPOS().map(g=>{const it=l.filter(a=>{const o=objDe(a);return o&&o.grupo===g});
    let min=0,imp=0,pend=0;it.forEach(a=>{const m=minutosTurno(a);if(m==null)pend++;else{min+=m;imp+=importeTurno(a)}});
    return{g,it,min,imp:cent(imp),pend}}).filter(x=>x.it.length);
}
const nombreMes=mes=>{const[a,m]=mes.split("-");return new Date(+a,+m-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"}).toUpperCase()};
function textoRendicion(mes){

    t+="\n\n"+x.g.toUpperCase()+" - Valor hora: "+v.map(y=>pesos(y)).join(" / ");
    x.it.forEach(a=>{const o=objDe(a),e=efDe(a.pid),mm=minutosTurno(a),p=o.puestos.find(z=>z.id===a.puesto);
      t+="\n"+fechaAR(a.fecha).slice(0,5)+" "+o.nombre+(p&&p.nombre?" "+p.nombre:"")+" - "+(e?nombreP(e)+(e.legajo?", Leg. "+e.legajo:""):"[efectivo]")+" - "+(a.entrada||"[ingreso]")+" a "+(a.salida||"[salida]")+" - "+(mm==null?"PENDIENTE":durTxt(mm))});

  return t+"\n\nTOTAL: "+durTxt(tm)+" - "+pesos(ti)+"\nPendientes de horario: "+(tp||"ninguno");

function porEfectivo(mes){

  return Object.entries(o).map(([k,v])=>({e:efDe(k),...v,imp:cent(v.imp)})).sort((a,b)=>b.min-a.min);
}

  <section class="panel"><h2>Feriados y días sin servicio</h2><p class="ayuda">Ese día el objetivo no aparece para cubrir y el mensaje lo informa sin servicio.</p>
    <div>${D.cierres.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(c=>`<div class="tel" style="grid-template-columns:1fr auto"><span>${fechaAR(c.fecha)} · ${esc(c.motivo)}<br><span class="ayuda">${esc(c.objs.map(id=>(D.adObj.find(o=>o.id===id)||{}).nombre).filter(Boolean).join(", "))}</span></span><button class="btn chico peligro" data-cb="${c.id}">Borrar</button></div>`).join("")||`<p class="ayuda">Sin feriados cargados.</p>`}</div>
    <div class="dos"><label>Fecha<input type="date" id="cF"></label><label>Motivo<input id="cM" placeholder="Feriado bancario" autocomplete="off"></label></div>
    <div class="fila">${D.adObj.map(o=>`<label class="check" style="border:0;padding:4px 8px 4px 0"><input type="checkbox" id="co_${o.id}" data-cobj="${o.id}" ${o.grupo==="Bancos"?"checked":""}><span>${esc(o.nombre)}</span></label>`).join("")}</div>
    <button class="btn" id="cOk">Agregar día sin servicio</button></section>
  <section class="panel"><h2>Objetivos y turnos</h2><datalist id="dlGr">${GRUPOS().map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
    ${D.adObj.map(o=>`<details data-oab="${o.id}" ${objAbierto===o.id?"open":""}><summary>${esc(o.nombre)} <span class="prog">${esc(o.grupo)}</span></summary><div class="vista" style="padding-top:0">
      <div class="dos"><label>Nombre<input id="on_${o.id}" data-on="${o.id}" value="${esc(o.nombre)}" autocomplete="off"></label><label>Categoría de precio<input id="og_${o.id}" data-og="${o.id}" list="dlGr" value="${esc(o.grupo)}" autocomplete="off"></label></div><label class="check" style="border:0"><input type="checkbox" id="osi_${o.id}" data-osi="${o.id}" ${cubreSiempre(o)?"checked":""}><span>Se cubre en todos los adicionales (avisa si falta)</span></label><div><b style="font-size:14px;color:var(--suave)">Días que abre</b><div class="fila">${DIAS.map(([n,l])=>`<label class="check" style="border:0;padding:4px 6px 4px 0"><input type="checkbox" id="od_${o.id}_${n}" data-od="${o.id}" data-dn="${n}" ${diasDe(o).includes(n)?"checked":""}><span>${l}</span></label>`).join("")}</div></div>
      ${o.puestos.map((p,i)=>`<div class="item"><b>Turno ${i+1}</b><div class="dos"><label>Nombre (Largo, Corto…)<input id="pn_${p.id}" data-pn="${p.id}" value="${esc(p.nombre)}" autocomplete="off"></label><label>Ingreso<input type="time" id="pe_${p.id}" data-pe="${p.id}" value="${esc(p.entrada)}"></label></div>
        <div class="dos"><label>Salida habitual (vacía si varía)<input type="time" id="ps_${p.id}" data-ps="${p.id}" value="${esc(p.salida)}"></label><label class="check" style="border:0;align-self:end"><input type="checkbox" id="pf_${p.id}" data-pf="${p.id}" ${p.fija?"checked":""}><span>El mensaje muestra ingreso y salida</span></label></div>
        <button class="btn chico peligro" data-pb="${p.id}">Quitar turno</button></div>`).join("")}
      <div class="fila"><button class="btn chico" data-pa="${o.id}">Agregar turno</button><button class="btn chico peligro" data-ob="${o.id}">Borrar objetivo</button></div></div></details>`).join("")}
    <button class="btn" id="oAdd">Agregar objetivo</button><p class="ayuda">Los horarios cargados acá se usan en los adicionales nuevos.</p></section>`;
}
function atarObjetivos(){
  const obj=id=>D.adObj.find(o=>o.id===id),pu=id=>D.adObj.flatMap(o=>o.puestos).find(x=>x.id===id),dueño=id=>D.adObj.find(o=>o.puestos.some(p=>p.id===id));
  document.querySelectorAll("[data-oab]").forEach(d=>d.ontoggle=()=>{if(d.open)objAbierto=d.dataset.oab;else if(objAbierto===d.dataset.oab)objAbierto=null});
  document.querySelectorAll("[data-vok]").forEach(b=>b.onclick=()=>{const g=b.dataset.vok,v=+document.getElementById("vv_"+g).value,d=document.getElementById("vd_"+g).value;
    if(!(v>0)||!d){tostada("Cargá valor y fecha");return}D.adVal.push({id:nuevoId(),grupo:g,valor:v,desde:d});guardar();pintar();tostada("Precio guardado")});
  document.querySelectorAll("[data-vb]").forEach(b=>b.onclick=()=>seguro("¿Estás seguro de borrar este precio? Cambia el cálculo de la rendición.",()=>{D.adVal=D.adVal.filter(v=>v.id!==b.dataset.vb);registrarCambio("Borrado de precio por hora","");guardar();pintar()}));
  document.querySelectorAll("[data-on]").forEach(i=>i.onchange=()=>{obj(i.dataset.on).nombre=i.value.trim()||"Sin nombre";guardar();pintar()});
  document.querySelectorAll("[data-og]").forEach(i=>i.onchange=()=>{const o=obj(i.dataset.og);o.grupo=i.value.trim()||o.nombre;guardar();pintar()});
  document.querySelectorAll("[data-pn]").forEach(i=>i.onchange=()=>{pu(i.dataset.pn).nombre=i.value.trim();guardar()});
  document.querySelectorAll("[data-pe]").forEach(i=>i.onchange=()=>{pu(i.dataset.pe).entrada=i.value;guardar()});
  document.querySelectorAll("[data-ps]").forEach(i=>i.onchange=()=>{pu(i.dataset.ps).salida=i.value;guardar()});
  document.querySelectorAll("[data-pf]").forEach(i=>i.onchange=()=>{pu(i.dataset.pf).fija=i.checked;guardar()});
  document.querySelectorAll("[data-od]").forEach(i=>i.onchange=()=>{const o=obj(i.dataset.od);o.dias=[...document.querySelectorAll(`[data-od="${o.id}"]`)].filter(x=>x.checked).map(x=>+x.dataset.dn);guardar()});
  document.querySelectorAll("[data-cb]").forEach(b=>b.onclick=()=>seguro("¿Estás seguro de borrar este día sin servicio?",()=>{D.cierres=D.cierres.filter(c=>c.id!==b.dataset.cb);guardar();pintar()}));
  $("cOk").onclick=()=>{const fe=$("cF").value,objs=[...document.querySelectorAll("[data-cobj]")].filter(x=>x.checked).map(x=>x.dataset.cobj);if(!fe||!objs.length){tostada("Elegí fecha y al menos un objetivo");return}D.cierres.push({id:nuevoId(),fecha:fe,motivo:$("cM").value.trim()||"Feriado",objs});guardar();pintar();tostada("Día sin servicio agregado")};
  document.querySelectorAll("[data-osi]").forEach(i=>i.onchange=()=>{obj(i.dataset.osi).siempre=i.checked;guardar()});
  document.querySelectorAll("[data-pa]").forEach(b=>b.onclick=()=>{obj(b.dataset.pa).puestos.push({id:nuevoId(),nombre:"",entrada:"",salida:"",nota:""});objAbierto=b.dataset.pa;guardar();pintar()});
  document.querySelectorAll("[data-pb]").forEach(b=>b.onclick=()=>{const id=b.dataset.pb;if(D.adic.some(a=>a.puesto===id)){tostada("Ese turno tiene adicionales cargados");return}
    seguro("¿Estás seguro de quitar este turno?",()=>{const o=dueño(id);o.puestos=o.puestos.filter(p=>p.id!==id);guardar();pintar()})});
  document.querySelectorAll("[data-ob]").forEach(b=>b.onclick=()=>{const id=b.dataset.ob;if(D.adic.some(a=>a.obj===id)){tostada("Ese objetivo tiene adicionales cargados");return}
    seguro("¿Estás seguro de borrar este objetivo?",()=>{D.adObj=D.adObj.filter(o=>o.id!==id);registrarCambio("Borrado de objetivo","");guardar();pintar()})});
  $("oAdd").onclick=()=>{const id=nuevoId();D.adObj.push({id,nombre:"Nuevo objetivo",grupo:"Nuevo objetivo",puestos:[{id:nuevoId(),nombre:"",entrada:"",salida:"",nota:""}]});objAbierto=id;guardar();pintar()};
}
function vistaEfAd(){
  return `${D.personal.length?`<section class="panel"><h2>Traer de tu guardia</h2><label>Copiar desde Personal<select id="adImp"><option value="">Elegir</option>${D.personal.filter(p=>!D.adEf.some(e=>e.origen===p.id)).map(p=>`<option value="${p.id}">${esc(nombreP(p))}</option>`).join("")}</select></label><p class="ayuda">Después completá su tipo de servicio.</p></section>`:""}${vistaReg("adEf")}`;
}
function atarEfAd(){const s=$("adImp");if(s)s.onchange=()=>{const p=D.personal.find(x=>x.id===s.value);if(p){D.adEf.push({id:nuevoId(),origen:p.id,jer:p.jer,nombre:p.nombre,legajo:p.legajo,dni:p.dni,tel:p.tel,loc:p.loc,reg:"24x48",ref:D.turnos.ref});guardar();pintar();tostada("Efectivo agregado")}};atarReg("adEf")}
const SUBA=[["armar","Armar",vistaArmar,atarArmar],["efectivos","Efectivos",vistaEfAd,atarEfAd],["rendicion","Rendición",vistaRendicion,atarRendicion],["objetivos","Objetivos",vistaObjetivos,atarObjetivos]];
function vistaAdic(){const S=SUBA.find(x=>x[0]===subA);return `<div class="vista">${subnav(SUBA.map(x=>[x[0],x[1]]),subA,"data-sad")}${S[2]()}</div>`}
function atarAdic(){document.querySelectorAll("[data-sad]").forEach(b=>b.onclick=()=>{subA=b.dataset.sad;pintar()});SUBA.find(x=>x[0]===subA)[3]()}

/* ---------- Navegación ---------- */
const TABS=[["inicio","Inicio",vistaInicio,atarInicio],["registro","Registro",vistaRegistro,atarRegistro],["servicio","Servicio",vistaServicio,atarServicio],["moviles","Móviles",vistaMoviles,atarMoviles],["adicionales","Adicional",vistaAdic,atarAdic],["mas","Más",vistaMas,atarMas]];
let tab=TABS.some(t=>t[0]===location.hash.slice(1))?location.hash.slice(1):"inicio";
function ir(t){if(!TABS.some(x=>x[0]===t)&&MAS.some(x=>x[0]===t)){subM=t;t="mas"}tab=t;try{location.hash=t}catch(e){}pintar();$("main").scrollTop=0}
function pintar(){
  if(!desbloqueada)return;
  const T=TABS.find(t=>t[0]===tab);const y=$("main").scrollTop;
  $("main").innerHTML=T[2]();T[3]();$("main").scrollTop=y;
  $("nav").innerHTML=TABS.map(t=>`<button data-t="${t[0]}" ${t[0]===tab?'aria-current="page"':""}>${t[1]}</button>`).join("");
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>ir(b.dataset.t));
}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h!==tab&&TABS.some(t=>t[0]===h)){tab=h;pintar()}});
function reloj(){$("reloj").textContent=horaAhora()}
setInterval(reloj,15000);reloj();iniciarProteccion();
if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>tostada("No se pudo activar el modo sin conexión")));
}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
</script>
